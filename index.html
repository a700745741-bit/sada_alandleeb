<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدى العندليب - مفتوح أكثر من 10</title>
<style>
:root{--p:#0b2e59;--s:#1a4b8c;--a:#25D366;--bg:#f4f7f6}
body{font-family:Tahoma;background:var(--bg);margin:0;padding:10px}
.header{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;padding:15px;border-radius:0 0 15px 15px;text-align:center}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 2px 5px rgba(0,0,0,.08)}
label{font-weight:bold;font-size:13px;color:var(--p);display:block;margin:8px 0 4px}
textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:10px;box-sizing:border-box;font-family:monospace;font-size:13px}
button{border:none;padding:12px;border-radius:8px;font-weight:bold;color:#fff;cursor:pointer;width:100%;margin-top:6px}
.btn-blue{background:var(--p)} .btn-green{background:var(--a)} .btn-orange{background:#e67e22} .btn-dark{background:#34495e}
.badge{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold;margin:2px}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th{background:var(--p);color:#fff;padding:8px} td{border:1px solid #ddd;padding:6px;text-align:center}
#preview{max-width:100%;border-radius:8px;display:none;margin-top:10px;border:1px solid #ddd}
canvas{display:none}
.auto-badge{background:#2ecc71;color:#fff;padding:6px 12px;border-radius:20px;font-size:11px}
</style>
</head>
<body>
<div class="header"><h2>🔥 صدى العندليب - تحدي التوقعات</h2><p style="margin:0;font-size:12px">مفتوح العدد - يطلع أكثر من 10 فائزين - فرز تلقائي</p></div>
<div class="card">
<label>✅ النتيجة الصحيحة (نفس الكليشة - بمسافة أو بدون):</label>
<textarea id="correctBox" style="height:160px" placeholder="*ميلان [2]*
*بولونيا [0]*
*جنوى [1]
يوفنتوس [1]"></textarea>
<label>📋 توقعات المشتركين (78 أو 100 أو 200 - يفرز تلقائي): <span class="auto-badge">فرز تلقائي + مفتوح العدد</span></label>
<textarea id="subsBox" style="height:380px" placeholder="الصق كل التوقعات هنا..."></textarea>
<div style="display:flex;gap:6px;margin-top:8px">
<select id="mode" style="padding:10px;border-radius:8px;border:1px solid #ccc;flex:1">
<option value="all">كل المباريات صح 100%</option>
<option value="most">نصف المباريات وأكثر</option>
<option value="one">مباراة واحدة على الأقل</option>
</select>
<button id="toggleAuto" class="btn-orange" style="width:130px" onclick="toggleAuto()">⏸️ إيقاف تلقائي</button>
</div>
<div style="margin-top:10px">
<span id="info" class="badge" style="background:#eef">بانتظار اللصق</span>
<span id="total" class="badge" style="background:#f1c40f">0 مشترك</span>
<span id="win" class="badge" style="background:#2ecc71;color:#fff">0 فائز</span>
<span id="matchCount" class="badge" style="background:#3498db;color:#fff">0 مباراة</span>
</div>
</div>
<div class="card">
<h3>📊 جدول الفائزين (مفتوح - يعرض الكل)</h3>
<table id="table"><thead><tr><th>#</th><th>الاسم</th><th>توقعه</th><th>صح</th></tr></thead><tbody id="tbody"><tr><td colspan="4" style="color:#888">الصق النتيجة والتوقعات - يطلع كل الفائزين حتى لو 50</td></tr></tbody></table>
<div style="display:flex;gap:6px;margin-top:10px">
<button class="btn-orange" style="flex:1" onclick="makeImage()">🖼️ كشف كصورة</button>
<button class="btn-green" style="flex:1" onclick="shareWA()">💬 واتساب</button>
</div>
<img id="preview"><canvas id="canvas"></canvas>
</div>
<script>
let autoEnabled=true; let lastImg='';
function saveAuto(){localStorage.setItem('sada_correct',document.getElementById('correctBox').value);localStorage.setItem('sada_subs',document.getElementById('subsBox').value);}
function loadAuto(){document.getElementById('correctBox').value=localStorage.getItem('sada_correct')||'';document.getElementById('subsBox').value=localStorage.getItem('sada_subs')||'';updateCounts();if(document.getElementById('subsBox').value.trim()&&document.getElementById('correctBox').value.trim()){setTimeout(sortWinners,500);}}
function toggleAuto(){autoEnabled=!autoEnabled;document.getElementById('toggleAuto').innerText=autoEnabled?'⏸️ إيقاف تلقائي':'▶️ تفعيل تلقائي';}
function extractScores(text){const regex=/\[[\s]*([0-9٠-٩]+)[\s]*\]/g;let out=[];let m;while((m=regex.exec(text))!==null){let num=m[1].trim();const ar='٠١٢٣٤٥٦٧٨٩';const en='0123456789';let conv='';for(let c of num){let idx=ar.indexOf(c);conv+=idx>=0?en[idx]:c;}if(conv)out.push(conv);}return out;}
function extractName(block){let n=block.match(/الإسم:\s*([^\n🔥]+)/);if(n)return n[1].trim();let lines=block.trim().split('\n').filter(l=>l.trim()&&!l.includes('[')&&!l.includes('تحدي'));return lines[lines.length-1]?.substring(0,30).replace(/[*_]/g,'').trim()||'بدون اسم';}
function updateCounts(){const subsText=document.getElementById('subsBox').value.trim();let blocks=subsText.split(/\n\s*\n/).filter(b=>b.trim().length>5);if(blocks.length<2)blocks=subsText.split(/🔥/).filter(b=>b.trim().length>5);if(subsText&&blocks.length<=1&&subsText.length>20)blocks=[subsText];if(!subsText)blocks=[];document.getElementById('total').innerText=blocks.length+' مشترك';const correct=extractScores(document.getElementById('correctBox').value);document.getElementById('matchCount').innerText=Math.floor(correct.length/2)+' مباراة ('+correct.length+' توقع)';}
function sortWinners(){saveAuto();updateCounts();const correctBox=document.getElementById('correctBox').value.trim();const subsText=document.getElementById('subsBox').value.trim();const mode=document.getElementById('mode').value;if(!correctBox||!subsText)return;const correct=extractScores(correctBox);if(correct.length===0)return;let blocks=subsText.split(/\n\s*\n/).filter(b=>b.trim().length>5);if(blocks.length<2)blocks=subsText.split(/🔥/).filter(b=>b.trim().length>5);if(blocks.length<2)blocks=subsText.split(/الإسم:/).filter(b=>b.trim().length>5).map(b=>'الإسم:'+b);let rows=[];blocks.forEach(block=>{const scores=extractScores(block);if(scores.length===0)return;let matchCount=0;const limit=Math.min(scores.length,correct.length);for(let i=0;i<limit;i++){if(scores[i]===correct[i])matchCount++;}let isWin=false;if(mode==='all')isWin=matchCount===correct.length&&scores.length>=correct.length;else if(mode==='most')isWin=matchCount>=Math.ceil(correct.length/2);else isWin=matchCount>=1;if(isWin){rows.push({name:extractName(block),scores:scores.join('-'),matchCount,total:correct.length});}});const tbody=document.getElementById('tbody');if(rows.length===0){tbody.innerHTML='<tr><td colspan="4">لا يوجد فائزين 100% - جرب (نصف المباريات)</td></tr>';}else{tbody.innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.scores}</td><td>${r.matchCount}/${r.total}</td></tr>`).join('');}document.getElementById('win').innerText=rows.length+' فائز (عرض الكل)';document.getElementById('info').innerText='✅ تم فرز '+blocks.length+' مشترك - وجدنا '+rows.length+' فائز - عرض الكل';}
function shareWA(){const table=document.getElementById('table').innerText;window.open('https://wa.me/?text='+encodeURIComponent('🏆 كشف الفائزين - صدى العندليب ('+document.getElementById('win').innerText+')\n'+document.getElementById('info').innerText+'\n\n'+table),'_blank');}
function makeImage(){const table=document.getElementById('table');const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');canvas.width=650;canvas.height=100+table.rows.length*32;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#0b2e59';ctx.fillRect(0,0,canvas.width,60);ctx.fillStyle='#fff';ctx.font='bold 18px Tahoma';ctx.textAlign='center';ctx.fillText('🏆 كشف الفائزين - صدى العندليب - '+document.getElementById('win').innerText,325,38);let y=85;ctx.fillStyle='#222';ctx.font='13px Tahoma';ctx.textAlign='right';for(let r of table.rows){let txt='';for(let c of r.cells)txt+=c.innerText+' | ';ctx.fillText(txt,630,y);y+=30;}lastImg=canvas.toDataURL('image/png');document.getElementById('preview').src=lastImg;document.getElementById('preview').style.display='block';}
document.getElementById('correctBox').addEventListener('input',()=>{saveAuto();updateCounts();if(autoEnabled)sortWinners();});
document.getElementById('subsBox').addEventListener('paste',()=>{document.getElementById('info').innerText='⏳ جاري اللصق والفرز...';setTimeout(()=>{saveAuto();updateCounts();if(autoEnabled)sortWinners();},600);});
document.getElementById('subsBox').addEventListener('input',()=>{saveAuto();updateCounts();if(autoEnabled&&document.getElementById('subsBox').value.length>30){clearTimeout(window._t);window._t=setTimeout(sortWinners,800);}});
document.getElementById('mode').addEventListener('change',sortWinners);
loadAuto();
</script>
</body>
</html>
